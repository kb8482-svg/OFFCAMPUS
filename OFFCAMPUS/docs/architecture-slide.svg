<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Arhitektura in uporabljene tehnologije</title>
  <desc id="desc">Trislojna arhitektura OffCampus aplikacije: brskalnik, Express REST API in SQLite.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f6f8fc"/><stop offset="1" stop-color="#eaf1f5"/></linearGradient>
    <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#234c7b"/><stop offset="1" stop-color="#10284d"/></linearGradient>
    <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#168c83"/><stop offset="1" stop-color="#0c665f"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#19304b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M1 1L12 7L1 13" fill="none" stroke="#7890a5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172b45}.title{font-size:54px;font-weight:750;letter-spacing:-1.5px}.subtitle{font-size:24px;fill:#657991}.ct{font-size:30px;font-weight:700;fill:#fff}.ck{font-size:16px;font-weight:700;letter-spacing:2px;fill:#d8e5f3}.body{font-size:22px}.small{font-size:18px;fill:#63778e}.pill{font-size:18px;font-weight:650}.foot{font-size:19px;fill:#546a80}</style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/><circle cx="1810" cy="65" r="180" fill="#d9eee9" opacity=".45"/><circle cx="95" cy="1010" r="190" fill="#dce7f5" opacity=".5"/>
  <text x="100" y="105" class="title">Arhitektura in uporabljene tehnologije</text>
  <text x="102" y="150" class="subtitle">Ločen uporabniški vmesnik, REST API in podatkovna baza</text>
  <path d="M542 473H681M1237 473H1377" stroke="#7890a5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="100" y="245" width="440" height="485" rx="28" fill="#fff"/><path d="M128 245H512Q540 245 540 273V366H100V273Q100 245 128 245Z" fill="url(#navy)"/><circle cx="135" cy="285" r="7" fill="#f4c779"/><circle cx="160" cy="285" r="7" fill="#a7d4c8"/><circle cx="185" cy="285" r="7" fill="#a8bad1"/><text x="132" y="329" class="ck">1 · ODJEMALEC</text><text x="132" y="415" class="ct" style="fill:#172b45">Spletni brskalnik</text><rect x="132" y="438" width="240" height="38" rx="19" fill="#e8eef7"/><text x="151" y="464" class="pill" style="fill:#24466f">localhost:5173</text><text x="132" y="525" class="body">HTML · CSS · JavaScript</text><text x="132" y="568" class="body">Vanilla JS · upodobitev CSR</text><text x="132" y="611" class="body">fetch() · JSON · localStorage</text><text x="132" y="665" class="small">Uporabnik upravlja podatke;</text><text x="132" y="693" class="small">vsebina se posodobi brez osvežitve.</text></g>
  <rect x="548" y="405" width="131" height="40" rx="20" fill="#fff" stroke="#dce5ef"/><text x="568" y="431" class="pill">HTTP · JSON</text><text x="552" y="518" class="small">zahteva / odziv</text>
  <g filter="url(#shadow)"><rect x="698" y="245" width="535" height="485" rx="28" fill="#fff"/><path d="M726 245H1205Q1233 245 1233 273V366H698V273Q698 245 726 245Z" fill="url(#teal)"/><text x="735" y="303" class="ck">2 · ZALEDJE</text><text x="735" y="343" class="ct">REST API</text><rect x="735" y="438" width="310" height="38" rx="19" fill="#dff2ef"/><text x="754" y="464" class="pill" style="fill:#11675f">Node.js · Express · localhost:3000</text><text x="735" y="525" class="body">REST poti · poslovna logika</text><text x="735" y="568" class="body">Preverjanje podatkov in pravic</text><text x="735" y="611" class="body">bcrypt · JWT · CORS · middleware</text><text x="735" y="665" class="small">Preveri zahtevo, izvede poizvedbo</text><text x="735" y="693" class="small">in vrne JSON odgovor.</text></g>
  <rect x="1243" y="405" width="128" height="40" rx="20" fill="#fff" stroke="#dce5ef"/><text x="1262" y="431" class="pill">SQL</text><text x="1256" y="518" class="small">branje / zapis</text>
  <g filter="url(#shadow)"><rect x="1393" y="245" width="427" height="485" rx="28" fill="#fff"/><path d="M1421 245H1792Q1820 245 1820 273V366H1393V273Q1393 245 1421 245Z" fill="#d28a43"/><text x="1430" y="303" class="ck">3 · PODATKI</text><text x="1430" y="343" class="ct">Podatkovna baza</text><rect x="1430" y="438" width="162" height="38" rx="19" fill="#fbefdf"/><text x="1452" y="464" class="pill" style="fill:#8c5727">SQLite</text><text x="1430" y="525" class="body">Relacijske tabele</text><text x="1430" y="568" class="body">Primarni in tuji ključi</text><text x="1430" y="611" class="body">SQL poizvedbe s parametri</text><text x="1430" y="665" class="small">Hrani uporabnike, transakcije,</text><text x="1430" y="693" class="small">cilje, deleže in račune.</text></g>
  <rect x="100" y="800" width="1720" height="150" rx="24" fill="#e7edf5" opacity=".9"/><text x="140" y="850" class="ck" style="fill:#425a75">VARNOST IN POVEZOVANJE</text>
  <rect x="140" y="878" width="330" height="46" rx="14" fill="#fff"/><text x="165" y="908" class="pill">JWT · zaščitene API poti</text><rect x="495" y="878" width="330" height="46" rx="14" fill="#fff"/><text x="520" y="908" class="pill">bcrypt · zgoščena gesla</text><rect x="850" y="878" width="330" height="46" rx="14" fill="#fff"/><text x="875" y="908" class="pill">CORS · ločena izvora</text><rect x="1205" y="878" width="575" height="46" rx="14" fill="#fff"/><text x="1230" y="908" class="pill">SQL parametri · varnejše poizvedbe</text>
  <text x="100" y="1010" class="foot">Razvoj lokalno: brskalnik → frontend → API → SQLite</text><text x="1795" y="1010" text-anchor="end" class="foot">OffCampus · 01</text>
</svg>
